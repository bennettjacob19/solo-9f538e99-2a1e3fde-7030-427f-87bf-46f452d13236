name: dns-regression

# One image, one long-running web console.  For every regression round the
# console starts that round's authoritative endpoint and resolver as child
# processes with round-specific ports and SQLite database, so two rounds can
# run in parallel with their own authoritative configuration, cache and logs.
# The web container owns and recycles those children.
#
#   web -- FastAPI regression console (HTTP 8000, published)
#          + per-round auth (UDP) and resolver (UDP) children, internal only
#
# The `rounddata` volume holds the console database plus each round's database
# and process logs.  Round A normally uses UDP 25353/25354 and round B
# 26353/26354 (the page shows the actual ports); the small published ranges
# are there so a round's resolver can also be queried with dig from the host.

services:
  web:
    build: .
    command: ["python", "-m", "app.web"]
    environment:
      DB_PATH: /data/app.db
      ROUND_DB_DIR: /data/rounds
      FIXED_DOMAIN: service.example
      WEB_PORT: "8000"
      FRESH_TTL: "5"
      STALE_WINDOW: "20"
      UPSTREAM_TIMEOUT: "2"
    ports:
      - "8000:8000"
      - "25353-25356:25353-25356/udp"
      - "26353-26356:26353-26356/udp"
    volumes:
      - rounddata:/data
    restart: unless-stopped

volumes:
  rounddata:
